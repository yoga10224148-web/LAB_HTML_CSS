<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Kampus STT Cipasung</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      color: #333;
    }
    header {
      background-color: #003366;
      color: white;
      padding: 20px;
    }
    header h1 {
      margin: 0 0 10px 0;
      font-size: 32px;
    }
    nav a {
      color: #cccccc;
      margin-right: 15px;
      text-decoration: none;
    }
    nav a:hover {
      color: #ffffff;
    }
    main {
      margin-top: 20px;
    }
    section {
      margin-bottom: 24px;
    }
    h2 {
      font-size: 24px;
      color: #003366;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    form p {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="email"] {
      padding: 8px;
      width: 100%;
      max-width: 300px;
      box-sizing: border-box;
    }
    button {
      background-color: #003366;
      color: white;
      padding: 8px 16px;
      border: none;
      cursor: pointer;
    }
    footer {
      background-color: #f4f4f4;
      padding: 15px;
      text-align: center;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <header>
    <h1>STT Cipasung</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Programs</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>About Us</h2>
      <p>STT Cipasung is a technology college in Tasikmalaya.</p>
      <img src="https://placehold.co/600x300?text=STT+Cipasung" alt="STT Cipasung Kampus">
    </section>

    <section>
      <h2>Contact Us</h2>
      <form>
        <p>
          <label for="name">Nama:</label>
          <input type="text" id="name" name="name" placeholder="Nama">
        </p>
        <p>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="Email">
        </p>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 STT Cipasung</p>
  </footer>

</body>
</html>
